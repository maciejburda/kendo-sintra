name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# ---------------------------------------------------------------------------
# PRZEŁĄCZNIK CUTOVERU
#
# 'false' — buduje pod adres podglądowy maciejburda.github.io/kendo-sintra.
#           Strony mają noindex, żeby nie konkurowały z kendosintra.pt.
#
# 'true'  — buduje pod własną domenę: dokłada plik CNAME i zdejmuje prefiks.
#           Przełącz DOPIERO gdy rekordy A wskazują na GitHuba (patrz README).
# ---------------------------------------------------------------------------
env:
  PRODUCTION: 'false'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Ustaw tryb budowania
        run: |
          if [ "$PRODUCTION" = "true" ]; then
            cp deploy/CNAME public/CNAME
            echo "ASTRO_BASE=/" >> "$GITHUB_ENV"
            echo "::notice::Build produkcyjny — domena $(cat deploy/CNAME)"
          else
            echo "ASTRO_BASE=/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_ENV"
            echo "::notice::Build podglądowy — prefiks /${GITHUB_REPOSITORY#*/}/, strony z noindex"
          fi

      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
