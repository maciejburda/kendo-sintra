name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# ---------------------------------------------------------------------------
# CUTOVER SWITCH
#
# 'false' — builds for the preview URL maciejburda.github.io/kendo-sintra.
#           Pages carry noindex so they do not compete with kendosintra.pt.
#
# 'true'  — builds for the custom domain: adds the CNAME file and drops the prefix.
#           Only flip this ONCE the A records point at GitHub (see README).
# ---------------------------------------------------------------------------
env:
  PRODUCTION: 'false'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Set build mode
        run: |
          if [ "$PRODUCTION" = "true" ]; then
            cp deploy/CNAME public/CNAME
            echo "ASTRO_BASE=/" >> "$GITHUB_ENV"
            echo "::notice::Production build — domain $(cat deploy/CNAME)"
          else
            echo "ASTRO_BASE=/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_ENV"
            echo "::notice::Preview build — prefix /${GITHUB_REPOSITORY#*/}/, pages set to noindex"
          fi

      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
